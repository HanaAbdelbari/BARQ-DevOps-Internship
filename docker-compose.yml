name: barq-assessment
x-app: &app
  build: .
  init: true
  restart: unless-stopped
  env_file: ./config/app.env
  environment: &app-env
    APP_HOST: "0.0.0.0"
    APP_PORT: "8080"
    APP_MESSAGE: "Welcome to BARQ Systems"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 3s
  networks: [frontend, backend]
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: barq_app
      POSTGRES_DB: barq_tasks
      POSTGRES_PASSWORD: BarqLabOnly_7qN2vK8c
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barq_app -d barq_tasks"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [backend]
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
    networks: [backend]
  app-01:
    <<: *app
    container_name: app-01
    environment:
      <<: *app-env
      INSTANCE_ID: "app-01"
  app-02:
    <<: *app
    container_name: app-02
    environment:
      <<: *app-env
      INSTANCE_ID: "app-02"
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:81"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app-01:
        condition: service_healthy
      app-02:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 64M
    networks: [frontend]
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres-data:
  redis-data: